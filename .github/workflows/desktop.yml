name: Build desktop apps

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Make the release first, so the Mac and Windows builds never race to create it.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create the GitHub release for this version
        run: |
          V=$(node -p "require('./desktop/package.json').version")
          gh release view "v$V" >/dev/null 2>&1 || gh release create "v$V" --title "$V" --notes "AudioLab Studio $V" || gh release view "v$V"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel     # builds the arm64 app (cross-build; arm64 runners are often full)
            script: release:mac
          - os: windows-latest
            script: release:win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Build the Core Audio volume helper (Mac)
        if: runner.os == 'macOS'
        run: |
          mkdir -p bin
          swiftc -O -target arm64-apple-macos11 native/alvol.swift -o bin/alvol
          codesign --force --sign - bin/alvol
          file bin/alvol
      - name: Build and publish to the GitHub release
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
