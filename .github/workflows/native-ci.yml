name: Native CI (task NB)

# Checks of the native engine on every push that touches it (task NB-R1, review RN5). Linux machines only on a
# push (they start at once); the Apple Silicon job runs when started by hand with "mac" ticked, because the hosted
# macOS queue can take hours (review decision D9). Nothing here builds or changes the app.
#   (linux and mac: the project document, aldoc, and its edit protocol against the page's side, task NB-R7)
#   linux:  Release and AddressSanitizer + UndefinedBehaviorSanitizer builds of every native target; alengine
#           selftest, the ring under two threads, the mixer (10 scenes) and every ported device (all presets, at
#           128 and 7 frames per call) against the web engine rendered in headless Chromium, bit for bit
#   tsan:   the ring under two threads, and the whole engine on the null device, with ThreadSanitizer
#   (linux also runs the engine on the null device end to end: the rate contract, the hand-over bit for bit, a
#   device that changes rate while sound plays, 300 source switches under load; task NB-R2)
#   node:   syntax of every bridge file, and the shell's side of the bridge against a stand-in engine
#           (crash recovery, gave-up, a hung engine, the worklet port, what the page may send; since NB-R3 the
#           feeder process, its bounded queue, and the watchdog for a frozen feeder and a hung engine)
#   electron: the real Electron shell, the real feeder and the real engine on the null device (task NB-R3, review
#           A8): the main process blocked 50 and 250 ms every second, and spinning 50 ms, with every frame bit for
#           bit and no gap; the old path for comparison; a frozen feeder replaced by the watchdog
on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'desktop/native-engine.js'
      - 'desktop/native-feeder.js'
      - 'desktop/preload.js'
      - 'tools/native-lab/**'
      - '.github/workflows/native-ci.yml'
  workflow_dispatch:
    inputs:
      mac:
        description: 'Also build and check on the Apple Silicon runner'
        type: boolean
        default: false
      runner:
        description: 'macOS runner label'
        type: string
        default: 'macos-15'

concurrency:
  group: native-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Machine
        run: |
          mkdir -p out
          { echo "arch: $(uname -m)"; uname -a; c++ --version | head -1; python3 --version; cargo --version; } | tee out/machine.txt   # cargo: Chromium's FFT (task NB-N3g)
      - name: Release build (every native target without the plug-in SDK)
        run: |
          cmake -S native -B build -DCMAKE_BUILD_TYPE=Release > out/cmake.txt 2>&1 || { tail -40 out/cmake.txt; exit 1; }
          cmake --build build -j 4 2>&1 | tee out/build.txt | grep -E 'error|warning:|Built target' || true
          test -x build/alengine && test -x build/alrender && test -x build/almix && test -x build/alringstress && test -x build/aldoc && test -x build/albus && test -x build/alnodes
      # shift-base is left out: the vendored LLVM libc shifts negative values (defined behaviour from C++20, and in
      # every compiler we use), see native/third_party/llvm-libc/src/__support/math/log_range_reduction.h
      - name: AddressSanitizer + UndefinedBehaviorSanitizer build
        run: |
          cmake -S native -B build-asan -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize=shift-base -fno-sanitize-recover=undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" > out/cmake-asan.txt 2>&1 || { tail -40 out/cmake-asan.txt; exit 1; }
          cmake --build build-asan -j 4 2>&1 | grep -E ' error' || true
          test -x build-asan/alrender
      - name: 'alengine selftest (Release, then sanitizers)'
        run: |
          build/alengine selftest | tee out/selftest.json
          build-asan/alengine selftest | tee out/selftest-asan.json
          python3 -c "import json;[exit(1) for f in ('out/selftest.json','out/selftest-asan.json') if not json.load(open(f))['ok']]"
      - name: The ring under two threads (Release, then sanitizers)
        run: |
          build/alringstress 5 | tee out/ringstress.json
          build-asan/alringstress 3 | tee out/ringstress-asan.json
      - name: 'The engine on the null device, end to end (rate contract, hand-over bit for bit, source switching; Release and sanitizers)'
        run: |
          set -o pipefail   # a failed check fails the step (tee alone hid the test's exit code)
          python3 tools/native-lab/engine_null_test.py build/alengine out/null | tee out/engine-null.txt
          python3 tools/native-lab/engine_null_test.py build-asan/alengine out/null-asan | tee out/engine-null-asan.txt
          # task NB-N1c: the deepest integer format on the wire ("bits":"deepest"), kept after a rate change
          python3 tools/native-lab/engine_deepest_test.py build/alengine | tee out/engine-deepest.txt
          python3 tools/native-lab/engine_deepest_test.py build-asan/alengine | tee out/engine-deepest-asan.txt
      - name: 'The mixer against the web engine (10 scenes, Release and sanitizers)'
        run: |
          python3 tools/native-lab/run_mix.py "$PWD/build/almix" out/mix | tail -1 | tee out/mix.txt
          python3 tools/native-lab/run_mix.py "$PWD/build-asan/almix" out/mix-asan | tail -1 | tee out/mix-asan.txt
          grep -qx 'ALL IDENTICAL' out/mix.txt && grep -qx 'ALL IDENTICAL' out/mix-asan.txt
      - name: "The mixer's buses against the web engine (task NB-N3d: groups, sends, returns, delay compensation, the master's devices; Release and sanitizers)"
        run: |
          python3 tools/native-lab/run_bus.py build/albus out/bus | tail -1 | tee out/bus.txt
          python3 tools/native-lab/run_bus.py build-asan/albus out/bus-asan | tail -1 | tee out/bus-asan.txt
          grep -qx 'ALL IDENTICAL' out/bus.txt && grep -qx 'ALL IDENTICAL' out/bus-asan.txt
      - name: 'The project document and its edit protocol (task NB-R7): 1,000 random edits and undos per song, page and engine equal'
        run: |
          build/aldoc selftest | tee out/aldoc-selftest.txt
          build-asan/aldoc selftest | tail -1 | tee out/aldoc-selftest-asan.txt
          node tools/native-lab/doc_sync_test.js build/aldoc --steps 1000 | tee out/doc-sync.txt
          node tools/native-lab/doc_sync_test.js build-asan/aldoc --steps 150 --seed 11 | tail -8 | tee out/doc-sync-asan.txt
          grep -q '^PASS' out/doc-sync.txt && grep -q '^PASS' out/doc-sync-asan.txt
      - name: Python, Playwright and Chromium (to run the app's own engine)
        run: |
          python3 -m pip install --quiet --break-system-packages playwright numpy || python3 -m pip install --quiet playwright numpy
          python3 -m playwright install --with-deps chromium > out/playwright.txt 2>&1 || { tail -20 out/playwright.txt; exit 1; }
      - name: Web engine references (every ported device, every preset)
        run: |
          T=$(build/alrender list | python3 -c "import json,sys;print(','.join(json.load(sys.stdin)))")
          python3 tools/native-lab/make_ref_core.py out/core "$T" | tail -2
          python3 -c "import json;cs=json.load(open('out/core/cases.json'))['cases'];print('side made with (beat0, beat0 after, bpm):', sorted(set((d.get('beat0'),d.get('beat0After'),d.get('bpm')) for c in cs for d in c['chain'] if d['type']=='side')))"
      - name: "Chromium's source nodes and wave shaper on their own (task NB-N3g: RustFFT tables, oscillators, constant source, wave shaper)"
        run: |
          python3 tools/native-lab/make_ref_nodes.py out/nodes | tail -1
          build/alnodes out/nodes/cases.json out/nodes/native > /dev/null
          python3 tools/native-lab/compare_nodes.py out/nodes > out/nodes-compare-all.txt || true
          { grep -v ' bit for bit$' out/nodes-compare-all.txt | head -20; tail -1 out/nodes-compare-all.txt; } | tee out/nodes-compare.txt
          mkdir -p out/nodes-asan/native && cp -r out/nodes/web out/nodes/cases.json out/nodes-asan/
          build-asan/alnodes out/nodes-asan/cases.json out/nodes-asan/native > /dev/null
          python3 tools/native-lab/compare_nodes.py out/nodes-asan | tail -1 | tee -a out/nodes-compare.txt
          test "$(grep -c '^\([0-9]*\) of \1 node cases bit for bit' out/nodes-compare.txt)" = 2
      - name: 'Every ported device against the web engine, bit for bit (Release; sanitizers at 128 and 7 frames per call)'
        run: |
          run() { # build blocksize dir
            mkdir -p "$3/native"; [ "$3" = out/core ] || cp -r out/core/web out/core/cases.json "$3/"
            "$1"/alrender cases out/core/cases.json out/core/in.wav "$3/native" $2 > "$3/native.jsonl"
            python3 tools/native-lab/compare_core.py "$3" > "$3/compare.txt" || true
            grep -v ' bit for bit$' "$3/compare.txt" | head -12   # the cases that differ, in the log
            echo "$1 at $2 frames: $(tail -1 "$3/compare.txt")" | tee -a out/core-compare.txt
          }
          run build 128 out/core
          run build-asan 128 out/core-asan
          run build-asan 7 out/core-asan-7
          run build 33 out/core-33   # task NB-N3g: calls off the browser's grid (the shapers hold one sub-block, compensated)
          build/alrender list | grep -q '"clip"'   # the shapers were built (cargo was found)
          grep -q '^build at 128 frames: \([0-9]*\) of \1 cases' out/core-compare.txt
          grep -q '^build-asan at 128 frames: \([0-9]*\) of \1 cases' out/core-compare.txt
      - name: Summary
        if: always()
        run: |
          { echo "## Native CI (Linux)"; for f in out/selftest.json out/ringstress.json out/ringstress-asan.json out/engine-null.txt out/engine-null-asan.txt out/engine-deepest.txt out/engine-deepest-asan.txt out/mix.txt out/mix-asan.txt out/core-compare.txt out/nodes-compare.txt out/bus.txt out/bus-asan.txt out/doc-sync.txt out/doc-sync-asan.txt; do if [ -f "$f" ]; then echo "### $f"; echo '```'; cut -c1-1500 "$f"; echo '```'; fi; done; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ci-linux
          path: |
            out/*.txt
            out/*.json
          retention-days: 14

  tsan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: The ring under two threads with ThreadSanitizer
        run: |
          g++ -std=c++17 -O1 -g -fsanitize=thread -ffp-contract=off -fno-fast-math native/tests/ring_stress.cpp -o ringstress-tsan -lpthread
          TSAN_OPTIONS="halt_on_error=1 second_deadlock_stack=1" ./ringstress-tsan 10 | tee ringstress-tsan.json
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat ringstress-tsan.json >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: The engine on the null device with ThreadSanitizer (source switching under load, rate changes from the listener thread)
        run: |
          cmake -S native -B build-tsan -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_FLAGS="-fsanitize=thread" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" > cmake-tsan.txt 2>&1 || { tail -30 cmake-tsan.txt; exit 1; }
          cmake --build build-tsan --target alengine -j 4 2>&1 | grep -E ' error' || true
          set -o pipefail
          python3 tools/native-lab/engine_null_test.py build-tsan/alengine out-tsan | tee engine-null-tsan.txt
          TSAN_OPTIONS=halt_on_error=1 python3 tools/native-lab/engine_deepest_test.py build-tsan/alengine | tee -a engine-null-tsan.txt
          { echo '```'; cat engine-null-tsan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-ci-tsan
          path: out-tsan
          retention-days: 14

  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax of every bridge file
        run: for f in desktop/native-engine.js desktop/native-feeder.js desktop/preload.js native/bridge/*.js tools/native-lab/*.js tools/native-lab/bridge-unit/*.js; do node --check "$f" || exit 1; echo "ok $f"; done
      - name: The shell's side of the bridge against a stand-in engine
        run: node tools/native-lab/bridge-unit/bridge_unit.js | tee bridge-unit.txt
      - name: Summary
        if: always()
        run: |
          { echo '```'; cat bridge-unit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  mac:
    if: github.event_name == 'workflow_dispatch' && inputs.mac
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Machine
        run: |
          mkdir -p out
          { echo "arch: $(uname -m)"; sw_vers; clang --version | head -1; node --version; cargo --version; } | tee out/machine.txt
      - name: Build every native target without the plug-in SDK (arm64)
        run: |
          cmake -S native -B build -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_BUILD_TYPE=Release > out/cmake.txt 2>&1 || { tail -40 out/cmake.txt; exit 1; }
          cmake --build build -j 4 -- -k 2>&1 | tee out/build.txt | grep -E 'error|warning:|Built target' || true   # -k: one failing target does not hide the others
          file build/alengine build/alrender build/almix build/alringstress build/aldoc build/albus | tee out/file.txt
      - name: "alengine selftest, the ring, the mixer (N3b's scenes against Linux's references: for information, the Mac's own decide below)"
        run: |
          build/alengine selftest | tee out/selftest.json
          build/alringstress 5 | tee out/ringstress.json
          python3 tools/native-lab/run_mix.py "$PWD/build/almix" out/mix | tail -1 | tee out/mix.txt
      - name: The project document and its edit protocol (task NB-R7)
        run: |
          build/aldoc selftest | tail -1 | tee out/aldoc-selftest.txt
          node tools/native-lab/doc_sync_test.js build/aldoc --steps 300 | tail -8 | tee out/doc-sync.txt
          grep -q '^PASS' out/doc-sync.txt
      - name: "The mixer's buses against the references made on Linux (task NB-N3d; the Mac's own references below decide)"
        continue-on-error: true
        run: python3 tools/native-lab/run_bus.py build/albus out/bus-linuxref | tee out/bus-linuxref.txt
      - name: "Playwright and Chromium on the Mac (for the Mac's own web references, review D3)"
        id: macchrome
        continue-on-error: true
        run: |
          python3 -m pip install --quiet --break-system-packages playwright numpy > out/pip.txt 2>&1 || python3 -m pip install --quiet --user playwright numpy >> out/pip.txt 2>&1
          python3 -m playwright install chromium > out/playwright.txt 2>&1 || { tail -20 out/playwright.txt; exit 1; }
      - name: "Every ported device and the mixer's buses against the web engine on the Mac, bit for bit (tasks NB-N3a, N3c, N3d, N3e)"
        if: steps.macchrome.outcome == 'success'
        run: |
          T=$(build/alrender list | python3 -c "import json,sys;print(','.join(json.load(sys.stdin)))")
          python3 tools/native-lab/make_ref_core.py out/core "$T" | tail -2
          python3 -c "import json;cs=json.load(open('out/core/cases.json'))['cases'];print('side made with (beat0, beat0 after, bpm):', sorted(set((d.get('beat0'),d.get('beat0After'),d.get('bpm')) for c in cs for d in c['chain'] if d['type']=='side')))"
          mkdir -p out/core/native
          build/alrender cases out/core/cases.json out/core/in.wav out/core/native 128 > out/core/native.jsonl
          python3 tools/native-lab/compare_core.py out/core > out/core-compare-all.txt || true
          { grep -v ' bit for bit$' out/core-compare-all.txt | head -20; tail -1 out/core-compare-all.txt; } | tee out/core-compare.txt   # the cases that differ, then the count
          python3 tools/native-lab/make_bus_ref.py out/busref | tail -3
          python3 tools/native-lab/run_bus.py build/albus out/bus out/busref | tee out/bus.txt
          python3 tools/native-lab/make_mix_ref.py > out/mixref-mac.txt 2>&1   # N3b's scenes, the Mac's own references (overwrites ref/mix in this checkout only)
          python3 tools/native-lab/run_mix.py "$PWD/build/almix" out/mix-macref | tail -1 | tee out/mix-macref.txt
          python3 tools/native-lab/make_ref_nodes.py out/nodes | tail -1   # task NB-N3g: Chromium's source nodes on the Mac
          build/alnodes out/nodes/cases.json out/nodes/native > /dev/null
          python3 tools/native-lab/compare_nodes.py out/nodes > out/nodes-compare-all.txt || true
          { grep -v ' bit for bit$' out/nodes-compare-all.txt | head -20; tail -1 out/nodes-compare-all.txt; } | tee out/nodes-compare.txt
          grep -q '^\([0-9]*\) of \1 cases bit for bit' out/core-compare.txt   # every case (task NB-N3e added the Pro EQ: 289; N3g the Soft Clipper and the Drive)
          grep -q '^\([0-9]*\) of \1 node cases bit for bit' out/nodes-compare.txt
          build/alrender list | grep -q '"clip"'   # the shapers were built (cargo was found)
          grep -qx 'ALL IDENTICAL' out/bus.txt
          grep -qx 'ALL IDENTICAL' out/mix-macref.txt
      - name: ThreadSanitizer (clang) on the ring
        run: |
          clang++ -std=c++17 -O1 -g -fsanitize=thread -ffp-contract=off -fno-fast-math native/tests/ring_stress.cpp -o build/ringstress-tsan
          TSAN_OPTIONS=halt_on_error=1 build/ringstress-tsan 5 | tee out/ringstress-tsan.json
      - name: The shell's side of the bridge against a stand-in engine
        run: node tools/native-lab/bridge-unit/bridge_unit.js | tee out/bridge-unit.txt
      - name: Summary
        if: always()
        run: |
          { echo "## Native CI (Apple Silicon)"; for f in out/machine.txt out/file.txt out/selftest.json out/ringstress.json out/ringstress-tsan.json out/mix.txt out/mix-macref.txt out/core-compare.txt out/nodes-compare.txt out/bus.txt out/bus-linuxref.txt out/doc-sync.txt out/bridge-unit.txt; do if [ -f "$f" ]; then echo "### $f"; echo '```'; cut -c1-1500 "$f"; echo '```'; fi; done; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ci-mac
          path: out
          retention-days: 14

  electron:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the engine (null device off the Mac)
        run: |
          cmake -S native -B build -DCMAKE_BUILD_TYPE=Release > cmake.txt 2>&1 || { tail -30 cmake.txt; exit 1; }
          cmake --build build --target alengine -j 4 2>&1 | grep -E ' error|Built target' || true
          test -x build/alengine
      - name: Electron, the version the desktop app uses (desktop/package-lock.json)
        run: |
          V=$(node -e "console.log(require('./desktop/package-lock.json').packages['node_modules/electron'].version)")
          echo "electron $V"
          mkdir -p "$RUNNER_TEMP/el" && cd "$RUNNER_TEMP/el" && npm init -y > /dev/null && npm install --no-audit --no-fund "electron@$V" > npm.txt 2>&1 || { tail -20 npm.txt; exit 1; }
          # this Electron fetches its binary on first use; fetch it now
          test -x node_modules/electron/dist/electron || node node_modules/electron/install.js
          test -x node_modules/electron/dist/electron
          sudo apt-get install -y -qq xvfb > /dev/null 2>&1 || true
          python3 -m pip install --quiet --break-system-packages numpy || python3 -m pip install --quiet numpy
      - name: 'The sound path out of the main process (task NB-R3): main blocked or busy, frozen feeder, the old path for comparison'
        shell: bash   # -eo pipefail: the test's exit code survives the tee
        run: |
          xvfb-run -a python3 tools/native-lab/feeder_test.py "$RUNNER_TEMP/el/node_modules/electron/dist/electron" build/alengine out-feeder | tee feeder-test.txt
          { echo '```'; cat feeder-test.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ci-electron
          path: |
            feeder-test.txt
            out-feeder/*/feeder.json
            out-feeder/*/electron-stderr.txt
            out-feeder/summary.json
          retention-days: 14
