<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>AudioLab glass engine test</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* LAYOUT: a full-window fake arrangement (2D canvas), the engine's glass over it in two layers (docked, floating), one control card top right. The glass gets its backdrop as a list of rectangles drawn on the GPU, not from the canvas. Single dark look on purpose (it imitates the app). */
:root{color-scheme:dark;--bg:#0a0a0c;--card:#14161c;--well:#0c0d11;--fg:#ececf1;--mut:#8f96a6;--line:#2a2e3a;--acc:#ffd23a;--accink:#1c1500;--edge:rgba(255,255,255,.14);--data:ui-monospace,'SF Mono',Menlo,monospace}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.4 Inter,system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;overflow:hidden}
#stage canvas.full{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#scene{z-index:0}#ph{position:absolute;z-index:1;top:0;left:0;width:1px;height:100%;background:#3ecf8e;will-change:transform}
.glA{z-index:2;pointer-events:none}.glB{z-index:4;pointer-events:none}
.gp{position:absolute;left:0;top:0;z-index:3;border-radius:var(--r);border:1px solid var(--edge);color:var(--mut);font-size:11px;padding:6px 10px;pointer-events:none}
.gp.fl{z-index:5}
#disp{position:absolute;z-index:3;border-radius:6px;border:1px solid var(--edge)}
#hud{position:fixed;z-index:10;top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:min(360px,calc(100% - 32px));max-height:calc(100% - 24px - env(safe-area-inset-top,0px));overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
#hud h1{font-size:15px;margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
#hud p{margin:0;color:var(--mut);font-size:12px}
.rowx{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12px}
.rowx label{display:flex;gap:5px;align-items:center}
select,button.b{font:inherit;color:var(--fg);background:#20232c;border:1px solid var(--line);border-radius:6px;padding:5px 8px}
button.b{cursor:pointer;font-weight:600}button.go{background:var(--acc);color:var(--accink);border-color:var(--acc)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#live{font:500 12px var(--data);font-variant-numeric:tabular-nums;background:var(--well);border-radius:8px;padding:8px;white-space:pre-wrap}
#res{font:500 11px/1.5 var(--data);background:var(--well);border-radius:8px;padding:8px;white-space:pre;overflow:auto;margin:0;user-select:all;-webkit-user-select:all}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--well);border-radius:8px;padding:3px}
.seg button{font:600 12px inherit;font-family:inherit;color:var(--mut);background:none;border:0;border-radius:6px;padding:6px 2px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--accink)}
#hud.min>:not(h1){display:none}
</style>

<div id="stage">
  <canvas id="scene" class="full"></canvas>
  <div id="ph" hidden></div>
  <canvas id="disp"></canvas>
</div>
<div id="hud">
  <h1>Glass engine test <button class="b" id="minb" aria-label="Fold the control card">Fold</button></h1>
  <p>The AudioLab glass engine over a moving arrangement. The glass draws its own background on the graphics card (lanes, clips as flat rectangles, the playhead); the arrangement canvas is never copied. "Canvas uploads" must stay 0.</p>
  <div class="seg" role="group" aria-label="Glass level" id="lvl">
    <button data-v="glass" aria-pressed="true" title="Lens, quarter-size background, drawn on every frame">Glass</button>
    <button data-v="light" aria-pressed="false" title="The same engine with the lens off, a smaller background, drawn 30 times per second">Light</button>
    <button data-v="solid" aria-pressed="false" title="No glass: plain panel colour">Solid</button>
  </div>
  <div class="rowx"><label for="srcsel">Background from</label><select id="srcsel"><option value="scene" selected>rectangles drawn on the graphics card</option><option value="copy">a small copy of the canvas (fallback)</option></select></div>
  <div class="rowx">
    <label for="scn">Underneath</label>
    <select id="scn"><option value="scroll">scrolling (worst case)</option><option value="play">playing (playhead moves)</option><option value="still">still</option></select>
    <label><input type="checkbox" id="drag" checked> move the mixer</label>
  </div>
  <div class="rowx" id="pch"></div>
  <div class="rowx"><label><input type="checkbox" id="dmove"> device display moves (a small copy per refresh)</label></div>
  <div class="rowx"><label for="lens">Lens</label><select id="lens"><option value="off">off</option><option value="fine">fine (up to 12 px)</option><option value="apple">Apple (up to 20 px)</option><option value="wide" selected>wide (up to 45 px)</option></select>
    <label for="blur">Blur</label><select id="blur"><option value="light" selected>light</option><option value="regular">regular</option><option value="heavy">heavy</option></select></div>
  <div class="rowx"><label for="face">Face</label><select id="face"><option value="bench" selected>as in the Glass Bench</option><option value="apple">Apple's numbers (0.125 / 1.125)</option></select></div>
  <div class="rowx"><label><input type="checkbox" id="rt"> Reduce transparency</label><label><input type="checkbox" id="ic"> Increase contrast</label></div>
  <div class="rowx"><button class="b" id="lose">Lose the graphics context</button><button class="b" id="rest">Restore it</button><label><input type="checkbox" id="soft"> allow software drawing</label></div>
  <div id="live">measuring…</div>
  <div class="rowx"><button class="b go" id="run">Run (about 40 s)</button><button class="b" id="brk">Time the pieces</button><button class="b" id="copy">Copy table</button></div>
  <pre id="res">No run yet.</pre>
</div>

<script src="glass-engine.js"></script>
<script>
const $=s=>document.querySelector(s),stage=$('#stage'),S=$('#scene'),sx=S.getContext('2d',{alpha:false}),DC=$('#disp'),dx=DC.getContext('2d',{alpha:false}),PH=$('#ph');
let W=0,H=0,D=1,t0=performance.now(),sceneDirty=true,gA=null,gB=null,cA=null,cB=null,level='glass',source='scene';
/* layer A = docked glass (under the DOM of the docked panels), layer B = floating glass (over it) */
const PD=[{k:'hdr',n:'Track headers',L:'A',kind:'docked'},{k:'tr',n:'Transport',L:'A',kind:'docked'},{k:'band',n:'Tab band',L:'A',kind:'docked'},{k:'dev',n:'Device panel',L:'A',kind:'docked'},
  {k:'mix',n:'Mixer window',L:'B',kind:'window'},{k:'menu',n:'Menu',L:'B',kind:'menu'},{k:'pill',n:'Pill',L:'B',kind:'pill'}];
const P={},FLAT=[.13,.15,.2,1];
$('#pch').innerHTML=PD.map(p=>`<label><input type="checkbox" id="p_${p.k}" checked> ${p.n}</label>`).join('');
PD.forEach(p=>{const e=document.createElement('div');e.className='gp'+(p.L==='B'?' fl':'');e.textContent=p.n;stage.appendChild(e);P[p.k]={...p,el:e,on:true,x:0,y:0,w:0,h:0,r:0,dx:0};$('#p_'+p.k).onchange=ev=>{P[p.k].on=ev.target.checked;layout()}});
const eng=p=>p.L==='A'?gA:gB,both=f=>{f(gA);f(gB)};

function layout(){const trH=48,devH=Math.min(262,H*.3|0),bandH=28,top=40,devTop=H-trH-devH;
  Object.assign(P.hdr,{x:0,y:top,w:Math.min(216,W*.3|0),h:devTop-bandH-top,r:0});
  Object.assign(P.tr,{x:0,y:H-trH,w:W,h:trH,r:0});
  Object.assign(P.band,{x:0,y:devTop-bandH,w:W,h:bandH,r:0});
  Object.assign(P.dev,{x:0,y:devTop,w:W,h:devH,r:0});
  const mw=Math.min(1100,W-60),mh=Math.min(430,H-trH-140);Object.assign(P.mix,{x:(W-mw)/2|0,y:70,w:mw,h:mh,r:16});
  Object.assign(P.menu,{x:Math.min(250,W-236),y:devTop-90,w:220,h:Math.min(230,devH+40),r:12});
  Object.assign(P.pill,{x:W-170,y:devTop-bandH-44,w:150,h:32,r:16});
  const dw=Math.max(60,Math.min(420,W-250)),dh=Math.max(40,devH-56),dX=Math.min(232,W-dw-12),dY=devTop+38;
  DC.style.cssText=`left:${dX}px;top:${dY}px;width:${dw}px;height:${dh}px`;DC.hidden=!P.dev.on;if(DC.width!==Math.round(dw*D)||DC.height!==Math.round(dh*D)){DC.width=Math.round(dw*D);DC.height=Math.round(dh*D)}drawDisp(0);
  for(const k in P){const p=P[k],e=p.el;e.hidden=!p.on;e.style.width=p.w+'px';e.style.height=p.h+'px';e.style.setProperty('--r',p.r+'px');e.style.translate=`${p.x+p.dx}px ${p.y}px`;
    const g=eng(p);if(g)g.addPanel({id:k,rect:[p.x+p.dx,p.y,p.w,p.h],radius:p.r,kind:p.kind,visible:p.on,over:p.L==='B'?'flats':'backdrop',z:k==='mix'?0:1})}
  /* what floating glass sees where it covers the docked panels: their flat colour and the device display */
  if(gB){for(const k of['hdr','tr','band','dev'])gB.setFlat(k,{rect:[P[k].x,P[k].y,P[k].w,P[k].h],color:FLAT,hidden:!P[k].on});gB.setFlat('disp',{rect:[dX,dY,dw,dh],radius:6,source:DC,hidden:!P.dev.on})}}
function size(){D=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;S.width=Math.round(W*D);S.height=Math.round(H*D);sceneDirty=true;base=0;if(gA){gA.resize(W,H,D);gB.resize(W,H,D);feed()}layout()}

/* ---------- the fake arrangement. Once as a picture (2D canvas, redrawn in full like the app does while it scrolls) ... ---------- */
const COL=['#e5534b','#4c8dff','#e3b341','#f0883e','#3ecf8e','#b77bff','#45c4d6','#e36fb0'],BG='#0a0a0c';
function drawScene(t){const scn=$('#scn').value,off=scn==='scroll'?(t*.12)%960:0,rh=64*D,bw=120*D;
  sx.fillStyle=BG;sx.fillRect(0,0,S.width,S.height);
  for(let r=0,y=40*D;y<S.height;r++,y+=rh){const c=COL[r%8];
    for(let i=-1;i<S.width/bw+9;i++){const seed=(i*7+r*13)%11;if(seed<3)continue;const x=i*bw-off*D%(bw*8)+(r%2)*bw*.5;
      sx.fillStyle=c+'88';sx.fillRect(x+1,y+2*D,bw-2,rh-4*D);sx.fillStyle=c;sx.fillRect(x+1,y+2*D,bw-2,14*D);
      sx.fillStyle='#ffffff55';for(let k=0;k<8;k++)sx.fillRect(x+6*D+k*bw/8.5,y+rh*.55,bw/14,3*D)}
    sx.fillStyle='#00000066';sx.fillRect(0,y+rh-1,S.width,1)}
  sx.fillStyle='#ffffff10';for(let x=-(off*D%bw);x<S.width;x+=bw)sx.fillRect(x,0,1,S.height);
  if(scn==='scroll'){sx.fillStyle='#3ecf8e';sx.fillRect(S.width*.5,0,Math.max(1,D),S.height)}}
/* ... and once as the list the engine draws on the graphics card: the same clips as flat rectangles (body and title band), lanes, playhead.
   No notes, no grid, no text. x in CSS px at zoom 1; scrolling only changes scrollX. Built when the window changes size, not per frame. */
function sceneData(){const lanes=[],clips=[];
  for(let r=0,y=40;y<H;r++,y+=64){lanes.push({y,h:64,color:BG});
    for(let i=-1;i<W/120+9;i++){const seed=(i*7+r*13)%11;if(seed<3)continue;clips.push({x:i*120+(r%2)*60+1/D,y:y+2,w:120-2/D,h:60,color:COL[r%8]})}}
  return{lanes,clips,bg:BG,titleH:14,bodyAlpha:.533,playheadColor:'#3ecf8e',playheadW:Math.max(1,D)/D,rect:[0,0,W,H],scrollX:0,zoom:1}}
function feed(){if(source==='scene')both(g=>{g.setBackdrop(null);g.setScene(sceneData())});else both(g=>{g.setScene(null);g.setBackdrop(S)});sceneDirty=true}
/* a device display: a DOM canvas on top of the docked glass, also fed to the floating layer as a flat picture (small-copy route) */
function drawDisp(t){const w=DC.width,h=DC.height;dx.fillStyle='#000';dx.fillRect(0,0,w,h);dx.strokeStyle='#ffd23a';dx.lineWidth=1.5*D;dx.beginPath();
  for(let x=0;x<=w;x+=3){const u=x/w,y=h/2+Math.sin(u*14+t/300)*Math.sin(u*3.1+t/1700)*h*.36;x?dx.lineTo(x,y):dx.moveTo(x,y)}dx.stroke();if(gB)gB.markFlatDirty('disp')}

/* ---------- engines ---------- */
const FACE={bench:{sat:1.3,mul:1,add:0},apple:{sat:1.3,mul:1.125,add:.125}};
function boot(){for(const g of[gA,gB])if(g)g.destroy();for(const c of[cA,cB])if(c)c.remove();
  const mkc=cls=>{const c=document.createElement('canvas');c.className='full '+cls;stage.appendChild(c);return c};cA=mkc('glA');cB=mkc('glB');
  const o=()=>({allowSoftware:$('#soft').checked||/[?#&]soft/.test(location.href),lens:$('#lens').value,blur:$('#blur').value,level,autoResize:false,
    reduceTransparency:$('#rt').checked?true:null,increaseContrast:$('#ic').checked?true:null,face:FACE[$('#face').value]});
  gA=AudioLabGlass.create(cA,o());gB=AudioLabGlass.create(cB,o());gA.resize(W,H,D);gB.resize(W,H,D);feed();layout();last2=null;
  window.__t={gA,gB,P,S,DC,stats,run,pieces,boot,layout,setLevel,setSource}}
function setLevel(v){level=v;both(g=>g.setLevel(v));document.querySelectorAll('#lvl button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v))}
function setSource(v){source=v;$('#srcsel').value=v;feed()}
document.querySelectorAll('#lvl button').forEach(b=>b.onclick=()=>setLevel(b.dataset.v));$('#srcsel').onchange=e=>setSource(e.target.value);
$('#lens').onchange=e=>both(g=>g.setLensPreset(e.target.value));$('#blur').onchange=e=>both(g=>g.setBlurPreset(e.target.value));$('#face').onchange=e=>both(g=>g.setFace(FACE[e.target.value]));
$('#rt').onchange=e=>both(g=>g.setAccessibility({reduceTransparency:e.target.checked?true:null}));$('#ic').onchange=e=>both(g=>g.setAccessibility({increaseContrast:e.target.checked?true:null}));
$('#lose').onclick=()=>both(g=>g.debug.lose());$('#rest').onclick=()=>both(g=>g.debug.restore());$('#soft').onchange=boot;
$('#scn').onchange=()=>{sceneDirty=true};

/* ---------- loop and measuring ---------- */
let last=0,ring=[],acc=null,cpu=0,cpuN=0,last2=null,rate={sd:0,up:0,fu:0,ss:0,dr:0},cpuAvg=0,base=0,win=[];
function stats(a){a=a||ring;if(!a.length)return null;const s=[...a].sort((x,y)=>x-y),q=p=>s[Math.min(s.length-1,Math.floor(p*s.length))],sum=a.reduce((x,y)=>x+y,0);return{fps:1000*a.length/sum,med:q(.5),p95:q(.95),worst:s[s.length-1],n:a.length}}
function frame(t){requestAnimationFrame(frame);const dt=t-last;last=t;if(dt>0&&dt<1000){ring.push(dt);if(ring.length>720)ring.shift();win.push(dt);if(acc)acc.push(dt)}
  const scn=$('#scn').value,T=t-t0,off=scn==='scroll'?(T*.12)%960:0;
  if($('#drag').checked&&P.mix.on){const nx=Math.round(Math.sin(T/900)*Math.min(160,W*.12));if(nx!==P.mix.dx){P.mix.dx=nx;P.mix.el.style.translate=`${P.mix.x+nx}px ${P.mix.y}px`;gB.updatePanel('mix',{rect:[P.mix.x+nx,P.mix.y,P.mix.w,P.mix.h]})}}
  /* the picture the user sees: redrawn in full while it scrolls; while playing only the playhead (its own thin layer) moves */
  if(scn==='scroll'||sceneDirty){drawScene(T);sceneDirty=false;if(source==='copy')both(g=>g.markDirty())}
  const phx=scn==='play'?(T*.15)%W:scn==='scroll'?W/2:null;PH.hidden=scn!=='play';if(scn==='play')PH.style.transform=`translateX(${phx}px)`;
  /* what the glass gets: two numbers. Scroll is one uniform, the playhead is one rectangle; the clip list is not touched */
  if(source==='scene')both(g=>{g.setView({scrollX:off});g.setPlayhead(phx==null?null:phx+off)});
  if($('#dmove').checked&&P.dev.on&&scn!=='still')drawDisp(T);
  const a=performance.now();gA.render(t);gB.render(t);cpu+=performance.now()-a;cpuN++}
const kept=(a,b)=>Math.min(100,100*a.length/(a.reduce((x,y)=>x+y,0)/b));
const snap=()=>({sd:gA.stats.sceneDraws+gB.stats.sceneDraws,up:gA.stats.uploads+gB.stats.uploads,fu:gA.stats.flatUploads+gB.stats.flatUploads,ss:gA.stats.sceneSends+gB.stats.sceneSends,dr:gA.stats.draws+gB.stats.draws,t:performance.now()});
setInterval(()=>{const s=stats(),n=snap();
  if(last2){const k=1000/(n.t-last2.t);for(const f of['sd','up','fu','ss','dr'])rate[f]=(n[f]-last2[f])*k}last2=n;cpuAvg=cpuN?cpu/cpuN:0;cpu=cpuN=0;
  /* the screen's own frame time: the shortest half-second median seen so far (nothing can be faster than the screen) */
  if(win.length>=10){const m=stats(win).med;if(!base||m<base)base=m}win=[];
  const st=g=>g.mode==='gl'?(g.info.isStatic?'plain tint':g.info.level+' ('+(g.info.source==='scene'?'drawn on GPU':'small copy')+')'):'fallback tint ('+g.reason+')';
  if(s)$('#live').textContent=`${s.fps.toFixed(0)} fps · frames delivered ${base?kept(ring,base).toFixed(0):'?'} % of ${base?(1000/base).toFixed(0):'?'} Hz\nmedian ${s.med.toFixed(2)} ms   95% ${s.p95.toFixed(2)} ms   worst ${s.worst.toFixed(1)} ms\nper second: background drawn on GPU ${rate.sd.toFixed(0)} · canvas uploads ${rate.up.toFixed(0)} (displays ${rate.fu.toFixed(0)}) · clip lists sent ${rate.ss.toFixed(0)} · face redraws ${rate.dr.toFixed(0)}\nengine calls ${cpuAvg.toFixed(3)} ms per frame (CPU side)\ndocked layer: ${st(gA)} · floating layer: ${st(gB)}\n${W}x${H} @ ${D}x = ${(S.width*S.height/1e6).toFixed(1)} MP`},500);
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),set=(id,v)=>{const e=$(id);if(e.type==='checkbox')e.checked=v;else e.value=v;e.dispatchEvent(new Event('change',{bubbles:true}))};
function head(){let ren='?';try{const g=gA.gl,gi=g&&g.getExtension('WEBGL_debug_renderer_info');if(gi)ren=g.getParameter(gi.UNMASKED_RENDERER_WEBGL)}catch(e){}
  return `${W}x${H} @ ${D}x (${(S.width*S.height/1e6).toFixed(1)} MP) · mixer moving: ${$('#drag').checked} · display moving: ${$('#dmove').checked}\npanels: ${PD.filter(p=>P[p.k].on).map(p=>p.k).join(' ')} · lens ${$('#lens').value} · blur ${$('#blur').value} · engine ${AudioLabGlass.version}\n${ren}\n${(navigator.userAgent.match(/(Chrome|Version|Firefox|Electron)\/[\d.]+/g)||[]).join(' ')}\n`}
/* the table: each level and each background route in turn, like Glass Bench 3. kept% = share of the screen's frames that were delivered (the first row sets the screen's frame time) */
const ROWS=[['Solid','solid','scene','scroll'],['Light, drawn on GPU','light','scene','scroll'],['Glass, drawn on GPU','glass','scene','scroll'],['Glass, drawn on GPU, playing','glass','scene','play'],['Light, small copy','light','copy','scroll'],['Glass, small copy','glass','copy','scroll']];
async function run(ms=4000){const b=$('#run'),btns=[b,$('#brk')],keep=[level,source,$('#scn').value],rows=[];btns.forEach(x=>x.disabled=true);let b0=0;
  for(const[n,lv,src,scn]of ROWS){b.textContent='Measuring: '+n;setLevel(lv);setSource(src);set('#scn',scn);await sleep(Math.min(1000,ms/2));acc=[];const c0=snap();await sleep(ms);const a=acc,c1=snap();acc=null;
    const s=stats(a),k=1000/(c1.t-c0.t);if(!b0)b0=s.med;rows.push(n.padEnd(29)+s.fps.toFixed(0).padStart(4)+kept(a,b0).toFixed(0).padStart(7)+s.med.toFixed(2).padStart(8)+s.p95.toFixed(2).padStart(7)+s.worst.toFixed(1).padStart(8)+((c1.sd-c0.sd)*k).toFixed(0).padStart(9)+((c1.up-c0.up)*k).toFixed(0).padStart(9)+((c1.ss-c0.ss)*k).toFixed(0).padStart(7))}
  setLevel(keep[0]);setSource(keep[1]);set('#scn',keep[2]);btns.forEach(x=>x.disabled=false);b.textContent='Run (about 40 s)';
  $('#res').textContent=`AudioLab glass engine test\n${head()}\nmode                          fps  kept%  median    95%   worst  GPU bg/s  uploads  lists\n`+rows.join('\n')+'\n\nkept% = share of the screen\'s frames that were delivered\nGPU bg/s = background drawn on the graphics card per second (two layers)\nuploads = canvas copies per second (must be 0 on the "drawn on GPU" rows)\nlists = clip lists sent per second (must be 0: scrolling and playing only change two numbers)';return rows}
/* each piece alone, with the graphics card made to finish before the clock stops (ms per call) */
async function pieces(n=40){if(gA.mode!=='gl')return;const b=$('#brk'),btns=[b,$('#run')],keep=source,px=new Uint8Array(4),d=[];btns.forEach(x=>x.disabled=true);b.textContent='Timing…';
  const fin=g=>g.gl.readPixels(0,0,1,1,g.gl.RGBA,g.gl.UNSIGNED_BYTE,px),tm=(g,fn)=>{fn();fin(g);const t=performance.now();for(let i=0;i<n;i++)fn();fin(g);return(performance.now()-t)/n};
  setSource('scene');await sleep(300);
  for(const[nm,g]of[['docked layer',gA],['floating layer',gB]]){d.push([nm+': send the clip list ('+g.info.sceneRects+' rectangles)',tm(g,()=>g.debug.send())]);d.push([nm+': draw the background + blur',tm(g,()=>g.debug.rebuild())]);d.push([nm+': draw the faces',tm(g,()=>g.debug.draw())]);await sleep(30)}
  setSource('copy');await sleep(300);

  setSource(keep);btns.forEach(x=>x.disabled=false);b.textContent='Time the pieces';
  $('#res').textContent=`AudioLab glass engine test: each piece alone, ms per call\n${head()}level ${level}\n\n`+d.map(([n,v])=>n.padEnd(52)+v.toFixed(3).padStart(8)).join('\n')+'\n\nWhile scrolling or playing, a frame costs "draw the background + blur" and "draw the faces" per layer. The clip list is sent only after an edit.';return d}
