<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>AudioLab Glass Bench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* LAYOUT: a full-window fake arrangement with AudioLab-sized glass panels over it; one control card top right. Single dark look on purpose (it imitates the app). */
:root{color-scheme:dark;--bg:#0a0a0c;--card:#14161c;--fg:#ececf1;--mut:#8f96a6;--line:#2a2e3a;--acc:#ffd23a;--accink:#1c1500;--data:ui-monospace,'SF Mono',Menlo,monospace}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.4 Inter,system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;overflow:hidden}
#scene,#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#gl{pointer-events:none}
.gp{position:absolute;left:0;top:0;border-radius:var(--r);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.2);background:rgba(22,28,42,.5);color:var(--mut);font-size:11px;padding:6px 10px;pointer-events:none}
.m-none .gp{background:rgba(22,28,42,.94)}
.m-gl .gp{background:none;border-color:transparent;box-shadow:none}
.m-blur .gp{backdrop-filter:blur(9px) saturate(1.72);-webkit-backdrop-filter:blur(9px) saturate(1.72)}
.m-gl #gl{display:block}#gl{display:none}
#hud{position:fixed;z-index:10;top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:min(350px,calc(100% - 32px));max-height:calc(100% - 24px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
#hud h1{font-size:15px;margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
#hud p{margin:0;color:var(--mut);font-size:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:#0c0d11;border-radius:8px;padding:3px}
.seg button{font:600 12px inherit;font-family:inherit;color:var(--mut);background:none;border:0;border-radius:6px;padding:6px 2px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--accink)}
.rowx{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12px}
.rowx label{display:flex;gap:5px;align-items:center}
select,button.b{font:inherit;color:var(--fg);background:#20232c;border:1px solid var(--line);border-radius:6px;padding:5px 8px}
button.b{cursor:pointer;font-weight:600}button.go{background:var(--acc);color:var(--accink);border-color:var(--acc)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#live{font:500 12px var(--data);background:#0c0d11;border-radius:8px;padding:8px;white-space:pre-wrap}
#res{font:500 11px/1.5 var(--data);background:#0c0d11;border-radius:8px;padding:8px;white-space:pre;overflow:auto;margin:0;user-select:all;-webkit-user-select:all}
#hud.min>:not(h1){display:none}
</style>

<div id="stage" class="m-gl">
  <canvas id="scene"></canvas>
  <canvas id="gl"></canvas>
  </div>
<div id="hud">
  <h1>AudioLab Glass Bench <button class="b" id="minb" aria-label="Fold the control card">Fold</button></h1>
  <p>The same glass panels drawn three ways over a moving arrangement. Run compares the levels and four versions of the engine. Compare presets shows what each lens and blur choice costs.</p>
  <div class="seg" role="group" aria-label="How the glass is drawn">
    <button data-m="none" aria-pressed="false" title="No glass at all: the Lightest setting">Solid</button>
    <button data-m="blur" aria-pressed="false" title="Plain blur, no lens: the Light setting">Blur</button>
    <button data-m="gl" aria-pressed="true" title="One shared blurred backdrop, every panel a shader with a rim lens">GL engine</button>
  </div>
  <div class="rowx">
    <label for="scn">Underneath</label>
    <select id="scn"><option value="scroll">scrolling (worst case)</option><option value="play">playhead only</option><option value="still">still</option></select>
    <label><input type="checkbox" id="drag" checked> move the mixer</label>
  </div>
  <div class="rowx" id="pch"></div>
  <div class="rowx"><label for="lens">Lens</label><select id="lens"><option value="off">off</option><option value="fine">fine (up to 12 px)</option><option value="apple">Apple (up to 20 px)</option><option value="wide" selected>wide (up to 45 px)</option></select>
    <label for="lv">Blur</label><select id="lv"><option value="2" selected>light</option><option value="3">regular</option><option value="4">heavy</option></select></div>
  <div class="rowx">
    <label><input type="checkbox" id="dirty" checked> GL redraws only on change</label></div>
  <div class="rowx"><label for="eng">Engine</label><select id="eng"><option value="half">half-size backdrop, every frame (first test)</option><option value="q1">quarter-size backdrop, every frame</option><option value="q2" selected>quarter-size, backdrop every 2nd frame</option><option value="q4">quarter-size, backdrop every 4th frame</option></select></div>
  <div id="live">measuring…</div>
  <div class="rowx"><button class="b go" id="run">Run (about 45 s)</button><button class="b" id="cmp">Compare presets (about 1 min)</button><button class="b" id="copy">Copy table</button></div>
  <pre id="res">No run yet.</pre>
</div>

<script>
const $=s=>document.querySelector(s),stage=$('#stage'),S=$('#scene'),G=$('#gl'),sx=S.getContext('2d',{alpha:false});
let W=0,H=0,D=1,mode='gl',t0=performance.now(),sceneDirty=true,glDirty=true;
const PD=[{k:'hdr',n:'Track headers'},{k:'tr',n:'Transport'},{k:'dev',n:'Device panel'},{k:'mix',n:'Mixer window'},{k:'pill',n:'Pill'}];
const P={};
$('#pch').innerHTML=PD.map(p=>`<label><input type="checkbox" id="p_${p.k}" checked> ${p.n}</label>`).join('');
PD.forEach(p=>{const e=document.createElement('div');e.className='gp';e.textContent=p.n;stage.appendChild(e);P[p.k]={el:e,on:true,x:0,y:0,w:0,h:0,r:14,dx:0};$('#p_'+p.k).onchange=ev=>{P[p.k].on=ev.target.checked;layout()}});

function layout(){const trH=48,devH=Math.min(262,H*.3|0),top=40;
  Object.assign(P.hdr,{x:0,y:top,w:Math.min(216,W*.3|0),h:H-top-trH-devH,r:0});
  Object.assign(P.tr,{x:0,y:H-trH,w:W,h:trH,r:0});
  Object.assign(P.dev,{x:0,y:H-trH-devH,w:W,h:devH,r:0});
  const mw=Math.min(1100,W-60),mh=Math.min(430,H-trH-140);Object.assign(P.mix,{x:(W-mw)/2|0,y:70,w:mw,h:mh,r:16});
  Object.assign(P.pill,{x:W-170,y:H-trH-devH-44,w:150,h:32,r:16});
  for(const k in P){const p=P[k],e=p.el;e.hidden=!p.on;e.style.width=p.w+'px';e.style.height=p.h+'px';e.style.setProperty('--r',p.r+'px');e.style.translate=`${p.x+p.dx}px ${p.y}px`}
  glDirty=true}
function size(){D=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;S.width=G.width=Math.round(W*D);S.height=G.height=Math.round(H*D);glSize();sceneDirty=true;layout()}

/* ---------- the fake arrangement (2D canvas, redrawn in full like the app does while playing) ---------- */
const COL=['#e5534b','#4c8dff','#e3b341','#f0883e','#3ecf8e','#b77bff','#45c4d6','#e36fb0'];
function drawScene(t){const scn=$('#scn').value,off=scn==='scroll'?(t*.12)%960:0,rh=64*D,bw=120*D;
  sx.fillStyle='#0a0a0c';sx.fillRect(0,0,S.width,S.height);
  for(let r=0,y=40*D;y<S.height;r++,y+=rh){const c=COL[r%8];
    for(let i=-1;i<S.width/bw+9;i++){const seed=(i*7+r*13)%11;if(seed<3)continue;const x=i*bw-off*D%(bw*8)+ (r%2)*bw*.5;
      sx.fillStyle=c+'88';sx.fillRect(x+1,y+2*D,bw-2,rh-4*D);sx.fillStyle=c;sx.fillRect(x+1,y+2*D,bw-2,14*D);
      sx.fillStyle='#ffffff55';for(let k=0;k<8;k++)sx.fillRect(x+6*D+k*bw/8.5,y+rh*.55,bw/14,3*D)}
    sx.fillStyle='#00000066';sx.fillRect(0,y+rh-1,S.width,1)}
  sx.fillStyle='#ffffff10';for(let x=-(off*D%bw);x<S.width;x+=bw)sx.fillRect(x,0,1,S.height);
  if(scn!=='still'){const px=scn==='scroll'?S.width*.5:((t*.15*D)%S.width);sx.fillStyle='#3ecf8e';sx.fillRect(px,0,Math.max(1,D),S.height)}}

/* lens presets: the width follows the size of each panel, so a thin bar gets a thinner lens than a tall side panel */
const LENS={off:[0,0],fine:[4,12],apple:[4,20],wide:[3,45]},bandOf=p=>{const[dv,mx]=LENS[$('#lens').value],sh=Math.min(p.w,p.h);return dv?Math.max(.5,Math.min(mx,sh/dv)):.5},amtOf=p=>LENS[$('#lens').value][0]?Math.min(Math.min(p.w,p.h)/2,Math.max(24,bandOf(p)*1.2)):0;
/* ---------- the engine: one shared backdrop, dual-Kawase pyramid, SDF rim lens per panel ---------- */
const gl=G.getContext('webgl2',{alpha:true,premultipliedAlpha:true,antialias:false,powerPreference:'high-performance'});
let glOK=!!gl,prog={},src,lev=[],vao,srcReady=false,srcMip=false,fc=0;
/* engine variants: q = start the blur from a quarter-size copy (Apple's macOS scale); div = refresh the blurred backdrop every Nth frame (panels still move every frame); noup, idle = diagnostics */
const EV={half:{q:0,div:1},q1:{q:1,div:1},q2:{q:1,div:2},q4:{q:1,div:4}};let ENG=EV.q2;
const VS=`#version 300 es
out vec2 v;void main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);v=p;gl_Position=vec4(p*2.-1.,0.,1.);}`;
const FDOWN=`#version 300 es
precision highp float;in vec2 v;uniform sampler2D t;uniform vec2 px;uniform float flip;out vec4 o;
void main(){vec2 u=vec2(v.x,mix(v.y,1.-v.y,flip));o=texture(t,u)*4.;o+=texture(t,u-px);o+=texture(t,u+px);o+=texture(t,u+vec2(px.x,-px.y));o+=texture(t,u-vec2(px.x,-px.y));o/=8.;}`;
const FUP=`#version 300 es
precision highp float;in vec2 v;uniform sampler2D t;uniform vec2 px;out vec4 o;
void main(){o=texture(t,v+vec2(-px.x*2.,0.));o+=texture(t,v+vec2(-px.x,px.y))*2.;o+=texture(t,v+vec2(0.,px.y*2.));o+=texture(t,v+px)*2.;o+=texture(t,v+vec2(px.x*2.,0.));o+=texture(t,v+vec2(px.x,-px.y))*2.;o+=texture(t,v+vec2(0.,-px.y*2.));o+=texture(t,v-px)*2.;o/=12.;}`;
const FGLASS=`#version 300 es
precision highp float;uniform sampler2D t;uniform vec2 res;uniform vec4 rc;uniform float rad,band,amt,dpr;out vec4 o;
float sd(vec2 p,vec2 b,float r){vec2 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,q.y),0.)-r;}
void main(){vec2 p=vec2(gl_FragCoord.x,res.y-gl_FragCoord.y),hb=rc.zw*.5,l=p-rc.xy-hb;float d=sd(l,hb,rad),a=clamp(.5-d,0.,1.);if(a<=0.)discard;
 float R=min(max(rad,band),min(hb.x,hb.y));vec2 q=abs(l)-hb+R,sg=vec2(l.x<0.?-1.:1.,l.y<0.?-1.:1.),n;float dl;
 if(q.x>0.&&q.y>0.){float L=length(q);dl=L-R;n=q/L*sg;}else if(q.x>q.y){dl=q.x-R;n=vec2(sg.x,0.);}else{dl=q.y-R;n=vec2(0.,sg.y);}
 float x=clamp(-dl/band,0.,1.),k=1.-sqrt(max(0.,1.-(1.-x)*(1.-x)));
 vec2 sp=p-n*k*amt;vec3 c=texture(t,vec2(sp.x/res.x,1.-sp.y/res.y)).rgb;
 float L=dot(c,vec3(.2126,.7152,.0722));c=mix(vec3(L),c,1.3);c=mix(c,vec3(.086,.11,.165),.5);
 float rim=smoothstep(1.6*dpr,0.,-d),lit=abs(dot(n,vec2(-.7071,-.7071)));c+=rim*(.06+.3*lit);
 o=vec4(c*a,a);}`;
function mk(fs){const p=gl.createProgram();for(const[ty,s]of[[gl.VERTEX_SHADER,VS],[gl.FRAGMENT_SHADER,fs]]){const sh=gl.createShader(ty);gl.shaderSource(sh,s);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(sh));gl.attachShader(p,sh)}gl.linkProgram(p);const u={};const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);for(let i=0;i<n;i++){const a=gl.getActiveUniform(p,i);u[a.name]=gl.getUniformLocation(p,a.name)}return{p,u}}
function tex(w,h){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);for(const[k,v]of[[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]])gl.texParameteri(gl.TEXTURE_2D,k,v);return t}
function glInit(){if(!glOK)return;try{prog.d=mk(FDOWN);prog.u=mk(FUP);prog.g=mk(FGLASS);vao=gl.createVertexArray()}catch(e){glOK=false;console.warn(e)}}
function glSize(){if(!glOK)return;for(const l of lev){gl.deleteTexture(l.t);gl.deleteFramebuffer(l.f);gl.deleteTexture(l.t2);gl.deleteFramebuffer(l.f2)}lev=[];if(src)gl.deleteTexture(src);src=tex(G.width,G.height);
  srcReady=srcMip=false;let w=G.width,h=G.height;for(let i=0;i<5;i++){w=Math.max(2,w>>1);h=Math.max(2,h>>1);const L={w,h};for(const s of['','2']){L['t'+s]=tex(w,h);L['f'+s]=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,L['f'+s]);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,L['t'+s],0)}lev.push(L)}glDirty=true}
function pass(pr,t,fb,w,h,pw,ph,flip){gl.bindFramebuffer(gl.FRAMEBUFFER,fb);gl.viewport(0,0,w,h);gl.useProgram(pr.p);gl.bindTexture(gl.TEXTURE_2D,t);gl.uniform2f(pr.u.px,.5/pw*2,.5/ph*2);if(pr.u.flip)gl.uniform1f(pr.u.flip,flip?1:0);gl.drawArrays(gl.TRIANGLES,0,3)}
function glFrame(newScene,upload=true){gl.bindVertexArray(vao);gl.disable(gl.BLEND);gl.disable(gl.SCISSOR_TEST);gl.activeTexture(gl.TEXTURE0);const n=+$('#lv').value;
  const st=ENG.q?1:0;
  if(newScene){gl.bindTexture(gl.TEXTURE_2D,src);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,ENG.q?gl.LINEAR_MIPMAP_LINEAR:gl.LINEAR);
    if((upload&&!ENG.noup)||!srcReady){gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,gl.RGBA,gl.UNSIGNED_BYTE,S);srcReady=true;srcMip=false}
    if(ENG.q&&!srcMip){gl.generateMipmap(gl.TEXTURE_2D);srcMip=true}
    pass(prog.d,src,lev[st].f,lev[st].w,lev[st].h,lev[st].w,lev[st].h,true);
    for(let i=st+1;i<st+n;i++)pass(prog.d,lev[i-1].t,lev[i].f,lev[i].w,lev[i].h,lev[i].w,lev[i].h,false);
    let t=lev[st+n-1].t;for(let i=st+n-2;i>=st;i--){pass(prog.u,t,lev[i].f2,lev[i].w,lev[i].h,lev[i].w,lev[i].h);t=lev[i].t2}}
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,G.width,G.height);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
  gl.useProgram(prog.g.p);gl.bindTexture(gl.TEXTURE_2D,n>1?lev[st].t2:lev[st].t);gl.uniform2f(prog.g.u.res,G.width,G.height);gl.uniform1f(prog.g.u.dpr,D);gl.enable(gl.SCISSOR_TEST);gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
  for(const k of['hdr','dev','tr','pill','mix']){const p=P[k];if(!p.on)continue;const x=(p.x+p.dx)*D,y=p.y*D,w=p.w*D,h=p.h*D,sh=Math.min(p.w,p.h);
    gl.scissor(Math.max(0,Math.floor(x)-1),Math.max(0,Math.floor(G.height-y-h)-1),Math.ceil(w)+2,Math.ceil(h)+2);
    gl.uniform4f(prog.g.u.rc,x,y,w,h);gl.uniform1f(prog.g.u.rad,p.r*D);gl.uniform1f(prog.g.u.band,bandOf(p)*D);gl.uniform1f(prog.g.u.amt,amtOf(p)*D);gl.drawArrays(gl.TRIANGLES,0,3)}}

/* ---------- loop and measuring ---------- */
let last=0,ring=[],acc=null,stress=1;
function setMode(m){if(m==='gl'&&!glOK)m='blur';mode=m;stage.className='m-'+m;document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===m));glDirty=sceneDirty=true;ring=[]}
function stats(a){if(!a.length)return null;const s=[...a].sort((x,y)=>x-y),q=p=>s[Math.min(s.length-1,Math.floor(p*s.length))],sum=a.reduce((x,y)=>x+y,0);return{fps:1000*a.length/sum,med:q(.5),p95:q(.95),worst:s[s.length-1],n:a.length}}
function frame(t){requestAnimationFrame(frame);const dt=t-last;last=t;if(dt>0&&dt<1000){ring.push(dt);if(ring.length>720)ring.shift();if(acc)acc.push(dt)}
  const scn=$('#scn').value;let moved=false;
  if($('#drag').checked&&P.mix.on){const nx=Math.round(Math.sin((t-t0)/900)*Math.min(160,W*.12));if(nx!==P.mix.dx){P.mix.dx=nx;P.mix.el.style.translate=`${P.mix.x+nx}px ${P.mix.y}px`;moved=true}}
  const redraw=scn!=='still'||sceneDirty;if(redraw){drawScene(t-t0);sceneDirty=false}
  if(mode==='gl'&&glOK&&!(ENG.idle&&!glDirty)){fc++;const fresh=glDirty||((redraw||!$('#dirty').checked)&&fc%ENG.div===0),need=fresh||redraw||moved;if(need||stress>1){glFrame(fresh||stress>1);for(let i=1;i<stress;i++)glFrame(true,false);glDirty=false}}}
setInterval(()=>{const s=stats(ring);if(s)$('#live').textContent=`${s.fps.toFixed(0)} fps   median ${s.med.toFixed(2)} ms   95% ${s.p95.toFixed(2)} ms   worst ${s.worst.toFixed(1)} ms\n${W}x${H} @ ${D}x = ${(S.width*S.height/1e6).toFixed(1)} MP${glOK?'':'   (WebGL2 not available)'}`},500);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const kept=(a,base)=>Math.min(100,100*a.length/(a.reduce((x,y)=>x+y,0)/base));
const ROWS=[['Solid (Lightest)','none'],['Blur (Light)','blur'],['GL half, every frame','gl',{q:0,div:1}],['GL quarter, every frame','gl',{q:1,div:1}],['GL quarter, every 2nd','gl',{q:1,div:2}],['GL quarter, every 4th','gl',{q:1,div:4}],['check: no upload','gl',{q:1,div:1,noup:1}],['check: layer only','gl',{q:1,div:1,idle:1}]];
async function run(){const b=$('#run');b.disabled=$('#cmp').disabled=true;const keep=mode,keepE=ENG,rows=[];let base=0;
  for(const[n,m,e]of ROWS){if(m==='gl'&&!glOK){rows.push([n,'WebGL2 not available']);continue}
    if(e)ENG=e;setMode(m);b.textContent='Measuring: '+n;await sleep(1200);acc=[];await sleep(4500);const st=stats(acc);if(!base)base=st.med;st.kept=kept(acc,base);acc=null;rows.push([n,st])}
  ENG=keepE;setMode(keep);b.disabled=$('#cmp').disabled=false;b.textContent='Run (about 45 s)';
  const gi=glOK&&gl.getExtension('WEBGL_debug_renderer_info'),ren=gi?gl.getParameter(gi.UNMASKED_RENDERER_WEBGL):'?';
  $('#res').textContent=`AudioLab Glass Bench 2\n${W}x${H} @ ${D}x (${(S.width*S.height/1e6).toFixed(1)} MP) · under: ${$('#scn').value} · mixer moving: ${$('#drag').checked}\npanels: ${PD.filter(p=>P[p.k].on).map(p=>p.k).join(' ')} · lens ${$('#lens').value} · blur ${$('#lv').value}\n${ren}\n${(navigator.userAgent.match(/(Chrome|Version|Firefox|Electron)\/[\d.]+/g)||[]).join(' ')}\n\n`+
   'mode                      fps  kept%  median    95%   worst\n'+rows.map(([n,x])=>typeof x==='string'?n.padEnd(25)+x:n.padEnd(25)+x.fps.toFixed(0).padStart(4)+x.kept.toFixed(0).padStart(7)+x.med.toFixed(2).padStart(8)+x.p95.toFixed(2).padStart(7)+x.worst.toFixed(1).padStart(8)).join('\n')+'\n\nkept% = share of the screen\'s frames that were delivered'}
/* what does each preset cost? The screen caps the frame rate, so instead of fps we count how many times the whole glass (blur pyramid + all panels) can be drawn per frame before frames start to drop. */
const PRE=[['lens off','off',3],['lens fine','fine',3],['lens Apple','apple',3],['lens wide','wide',3],['blur light','apple',2],['blur regular','apple',3],['blur heavy','apple',4]];
async function compare(){if(!glOK)return;const b=$('#cmp'),keep=[mode,$('#lens').value,$('#lv').value];b.disabled=$('#run').disabled=true;
  setMode('none');b.textContent='Measuring the screen';await sleep(800);acc=[];await sleep(1500);const base=stats(acc).med;acc=null;setMode('gl');const rows=[];
  for(const[n,l,v]of PRE){$('#lens').value=l;$('#lv').value=v;glDirty=true;b.textContent='Measuring: '+n;const r=[];
    for(const k of[1,2,4]){stress=k;await sleep(400);acc=[];await sleep(2000);r.push(kept(acc,base).toFixed(0).padStart(7));acc=null}
    stress=1;rows.push(n.padEnd(14)+r.join(''))}
  $('#lens').value=keep[1];$('#lv').value=keep[2];setMode(keep[0]);b.disabled=$('#run').disabled=false;b.textContent='Compare presets (about 1 min)';
  const gi=gl.getExtension('WEBGL_debug_renderer_info'),ren=gi?gl.getParameter(gi.UNMASKED_RENDERER_WEBGL):'?';
  $('#res').textContent=`AudioLab Glass Bench 2: cost of each preset (engine: ${$('#eng').selectedOptions[0].textContent})\n${W}x${H} @ ${D}x (${(S.width*S.height/1e6).toFixed(1)} MP) · screen frame ${base.toFixed(2)} ms (${(1000/base).toFixed(0)} Hz)\n${ren}\n\nframes kept, %    x1     x2     x4\n`+rows.join('\n')+'\n\nx2, x4 = the whole glass drawn 2 or 4 times per frame, to show how much room is left'}
$('#cmp').onclick=compare;
/* direct timing (forces the GPU to finish; used for checks on machines without a screen cap) */
function costSync(n=20){const out={},px=new Uint8Array(4),keep=[$('#lens').value,$('#lv').value];glFrame(true);for(const[nm,l,v]of PRE){$('#lens').value=l;$('#lv').value=v;glFrame(true,false);gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);const t=performance.now();for(let i=0;i<n;i++)glFrame(true,false);gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);out[nm]=+((performance.now()-t)/n).toFixed(2)}$('#lens').value=keep[0];$('#lv').value=keep[1];return out}
$('#run').onclick=run;
$('#copy').onclick=async e=>{const b=e.currentTarget;try{await navigator.clipboard.writeText($('#res').textContent);b.textContent='Copied'}catch(x){const r=document.createRange();r.selectNodeContents($('#res'));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='Selected'}setTimeout(()=>b.textContent='Copy table',1500)};
$('#minb').onclick=e=>{const m=$('#hud').classList.toggle('min');e.currentTarget.textContent=m?'Open':'Fold'};
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
$('#eng').onchange=e=>{ENG=EV[e.target.value];glDirty=true};$('#scn').onchange=()=>{sceneDirty=true};$('#lv').onchange=$('#lens').onchange=()=>{glDirty=true};
addEventListener('resize',size);glInit();size();setMode(glOK?'gl':'blur');requestAnimationFrame(frame);
window.__bench={run,setMode,compare,costSync,stats:()=>stats(ring)};
</script>
